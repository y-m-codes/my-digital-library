<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div id="wrapper">

    <div id="page-title">
      <h1>Library</h1>
    </div>

    <div id="book-list">
    </div>

    <div id="new-book-div">
      <!-- <button id="btn-new-book">
        Add new book
      </button> -->

      <form id="form-add-new-book">
        <!-- action="example.com/path" method="post" -->
        <label for="title">Title:</label>
        <input type="text" id="new-book-title" required pattern=".*\S.*">

        <label for="author">Author:</label>
        <input type="text" id="new-book-author">

        <label for="publishing-year">Publishing year:</label>
        <input type="text" id="new-book-publishing-year" pattern="^\d{1,4}$">

        <label for="pages">Pages:</label>
        <input type="text" id="new-book-pages" pattern="\d+">

        <label for="read">Read:</label>
        <select name="read" id="read-status">
          <option value="Unread" selected>Unread</option>
          <option value="read">Read</option>
        </select>

        <button type="reset">Clear entry</button>

        <button type="submit" id="btn-add-new-book">Add new book</button>
      </form>

    </div>

  </div>
    <script src="index.js"></script>
</body>
</html>
