<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div id="wrapper">

    <div id="page-title">
      <h1>Library</h1>
    </div>

    <div id="toolbar">
      <div id="search-div">
        <input type="search" id="site-search" name="q" placeholder="Type your search here..."/>
        <button id="search-btn">Search</button>
      </div>

      <div id="read-status">
        <button type="button" id="no-filter-btn">All</button>
        <button type="button" id="read-btn">Read</button>
        <button type="button" id="unread-btn">Unread</button>
      </div>

      <div id="sort-by-div">
        <label for="sort-by">Sort by:</label>

        <select name="sort" id="sort-by">
          <option value="" selected>--Please choose an option--</option>
          <option value="title">Title</option>
          <option value="year">Year</option>
          <!-- <option value="date-added">Date Added</option> -->
          <!-- <option value="date-read">Date Read</option> -->
        </select>
      </div>
    </div>

    <div id="book-list">
    </div>

    <div id="new-book-div">

      <form id="new-book-form">
        <label for="title">Title:</label>
        <input type="text" id="title" required pattern=".*\S.*">

        <label for="author">Author:</label>
        <input type="text" id="author">

        <label for="year">Year:</label>
        <input type="text" id="year" pattern="^\d{1,4}$">

        <label for="pages">Pages:</label>
        <input type="text" id="pages" pattern="\d+">

        <label for="read">Read:</label>
        <select name="read" id="read-status">
          <option value="Unread" selected>Unread</option>
          <option value="read">Read</option>
        </select>

        <button type="reset">Clear entry</button>

        <button type="submit" id="new-book-btn">Add new book</button>
      </form>

    </div>

  </div>
    <script src="index.js"></script>
</body>
</html>
