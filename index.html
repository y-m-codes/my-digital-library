<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <div id="wrapper">

    <div id="page-title">
      <h1>My Digital Library</h1>
    </div>

    <div id="toolbar">
      <div id="search-div">
        <input type="search" id="site-search" name="q" placeholder="Type your search here"/>
        <button id="search-btn" class="btn">Search</button>
      </div>

      <div id="read-filter">
        <button type="button" id="no-filter-btn" class="btn">All</button>
        <button type="button" id="read-btn" class="btn">Read</button>
        <button type="button" id="unread-btn" class="btn">Unread</button>
      </div>

      <div id="sort-by-div">
        <label for="sort-by">Sort by:</label>

        <select name="sort" id="sort-by">
          <option value="" selected>--Please choose an option--</option>
          <option value="title">Title, alphabetical</option>
          <option value="year">Year, ascending</option>
        </select>
      </div>

      <div id="bulk-action-div">
        <label for="bulk-select">Bulk select:</label>

        <select name="bulk-action" id="bulk-action">
          <option value="" selected>--Please choose an option--</option>
          <option value="delete">Delete</option>
          <option value="mark-read">Mark as read</option>
          <option value="mark-unread">Mark as unread</option>
        </select>
      </div>
    </div>

    <div id="library-div">
    </div>

    <div id="new-book-div">

      <form id="new-book-form">
        <label for="title">Title:</label>
        <input type="text" id="title" required pattern=".*\S.*">

        <label for="author">Author:</label>
        <input type="text" id="author">

        <label for="year">Year:</label>
        <input type="text" id="year" pattern="^\d{1,4}$">

        <label for="pages">Pages:</label>
        <input type="text" id="pages" pattern="\d+">

        <label for="read">Read:</label>
        <select name="read" id="read-status">
          <option value="Unread" selected>Unread</option>
          <option value="read">Read</option>
        </select>

        <button type="reset" class="btn">Clear entry</button>

        <button type="submit" id="new-book-btn" class="btn">Add new book</button>
      </form>

    </div>

  </div>


    <script src="index.js"></script>
</body>
</html>
